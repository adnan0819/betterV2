<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree outline comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --ink: #1d1c1a;
    --muted: #6b6861;
    --line: #dcd8cf;
    --card: #ffffff;
    --accent: #1f5f4a;
    --accent-ink: #ffffff;
    --star: #e2a300;
    --star-off: #d9d5cc;
    --panel: 400px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 32px 0; }
  header h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .bar { height: 3px; background: var(--line); margin: 12px 32px 0; border-radius: 2px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 32px 40px; }
  .prompt { font-family: "Source Serif 4", Georgia, serif; font-size: 20px; margin: 4px 0 18px; text-align: center; min-height: 28px; }
  .row { display: grid; grid-template-columns: var(--panel) var(--panel) var(--panel); gap: 16px; }
  .panel { position: relative; width: var(--panel); }
  .panel img { display: block; width: var(--panel); height: var(--panel); border-radius: 8px; background: #e9e6df; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); user-select: none; -webkit-user-drag: none; transition: opacity .2s, box-shadow .2s; }
  .panel.dim img { opacity: .35; }
  .panel.chosen img { box-shadow: 0 0 0 3px var(--accent), 0 8px 24px rgba(0,0,0,.08); }
  .panel .rate-label { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; color: #fff; background: rgba(0,0,0,.68); padding: 9px 18px; border-radius: 999px; font-size: 17px; font-weight: 500; letter-spacing: .01em; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .panel .tag { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,.85); padding: 3px 8px; border-radius: 999px; }
  .choices { display: grid; grid-template-columns: var(--panel) var(--panel) var(--panel); gap: 16px; margin-top: 16px; }
  button.choice { height: 48px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; color: var(--ink); transition: background .12s, border-color .12s, transform .06s, opacity .2s; }
  button.choice:hover { border-color: var(--accent); }
  button.choice:active { transform: translateY(1px); }
  button.choice.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.choice.primary:hover { filter: brightness(1.08); }
  button.choice kbd { font: inherit; font-size: 12px; color: inherit; opacity: .6; margin-left: 8px; }
  button.choice:disabled { opacity: .35; cursor: default; }
  .mid-note { display: flex; align-items: center; justify-content: center; height: 48px; color: var(--muted); font-size: 15px; font-weight: 500; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 14px; min-height: 18px; }
  /* star rating */
  .rate { height: 48px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .stars { position: relative; display: inline-block; font-size: 34px; line-height: 1; letter-spacing: 2px; cursor: pointer; user-select: none; }
  .stars .off { color: var(--star-off); }
  .stars .on { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--star); width: 0; pointer-events: none; transition: width .05s; }
  .stars .zones { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); }
  .stars .zones span { display: block; }
  .rate .val { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 500; min-width: 32px; color: var(--muted); }
  /* instructions */
  .sheet { max-width: 760px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 40px 48px; margin-top: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.05); }
  .sheet h2 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 32px; margin: 0 0 18px; }
  .sheet p { line-height: 1.5; margin: 0 0 16px; font-size: 19px; }
  .sheet p.small { color: var(--muted); font-size: 14px; margin-top: 22px; }
  .expect { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 8px 0 4px; }
  .expect img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #e9e6df; }
  .expect .cap { font-size: 17px; font-weight: 500; margin-top: 10px; text-align: center; }
  .expect .cap .stars { font-size: 22px; cursor: default; display: inline-block; }
  .expect .cap .line { display: block; margin-top: 4px; }
  .rate-hint { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 2px; }
  .remind { margin-top: 4px; background: none; border: 0; color: var(--accent); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .backdrop { position: fixed; inset: 0; background: rgba(20,19,17,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: var(--card); border-radius: 14px; padding: 28px 32px 24px; max-width: 920px; width: calc(100% - 48px); max-height: calc(100vh - 48px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative; }
  .modal h3 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; margin: 0 0 16px; }
  .modal .close { position: absolute; top: 14px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; cursor: pointer; color: var(--ink); }
  .modal .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .modal .pair img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #e9e6df; display: block; }
  .modal .pair .cap { font-size: 15px; font-weight: 500; text-align: center; margin: 6px 0 12px; }
  .modal .pair .cap > .stars { display: block; margin-top: 2px; position: static; }
  .modal .pair .cap .stars.inner { font-size: 18px; cursor: default; display: inline-block; }
  .modal .foot { text-align: center; margin-top: 8px; }
  .go { margin-top: 24px; height: 50px; padding: 0 32px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .center { text-align: center; }
  @media (max-width: 1300px) { :root { --panel: 340px; } }
  @media (max-width: 1100px) { :root { --panel: 300px; } }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --ink: #eceae4; --muted: #9b978e; --line: #2d2b27; --card: #1f1e1b; --accent: #4fa684; --accent-ink: #0f1a15; --star-off: #3a3832; }
    .panel img, .expect img { background: #2a2825; }
    .panel .rate-label { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); white-space: nowrap; color: #fff; background: rgba(0,0,0,.68); padding: 9px 18px; border-radius: 999px; font-size: 17px; font-weight: 500; letter-spacing: .01em; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .panel .tag { background: rgba(31,30,27,.85); }
  }
</style>
</head>
<body>
<header>
  <h1>Tree outline comparison</h1>
  <div class="count" id="count"></div>
</header>
<div class="bar"><div id="prog"></div></div>
<main id="main"></main>

<script src="config.js"></script>
<script>
(async function () {
  const C = window.STUDY_CONFIG || {};
  const qs = new URLSearchParams(location.search);
  const pid = qs.get("PROLIFIC_PID") || qs.get("pid") || ("anon-" + Math.random().toString(36).slice(2, 10));
  const main = document.getElementById("main");
  const countEl = document.getElementById("count");
  const progEl = document.getElementById("prog");

  let EXT = ".jpg";
  const imgPath = (key, crop) => key.startsWith("gold_") ? `gold/${key.slice(5)}/${crop}${EXT}` : `${key}/${crop}${EXT}`;
  const rawPath = crop => `raw/${crop}${EXT}`;
  const STARS = "&#9733;&#9733;&#9733;&#9733;&#9733;";
  const N_PAIRS = C.EXAMPLE_PAIRS || 3;
  const exPath = (kind, k) => `examples/${kind}_${k}${EXT}`;
  const starHtml = (v, interactive) => `
    <span class="stars" data-v="${v}">
      <span class="off">${STARS}</span>
      <span class="on" style="width:${(v / 5) * 100}%">${STARS}</span>
      ${interactive ? `<span class="zones">${Array.from({ length: 10 }, (_, k) => `<span data-h="${(k + 1) / 2}"></span>`).join("")}</span>` : ""}
    </span>`;

  // ---------- schedule + block assignment ----------
  const schedule = await fetch("schedule.json").then(r => r.json());
  const nBlocks = schedule.n_blocks;
  if (schedule.ext) EXT = schedule.ext;
  let block = null;
  const saveKey = "crownstudy2:" + pid;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(saveKey) || "null"); } catch (e) {}
  if (saved && typeof saved.block === "number") block = saved.block;
  if (block === null && C.ENDPOINT) {
    try {
      const r = await fetch(`${C.ENDPOINT}?pid=${encodeURIComponent(pid)}&n=${nBlocks}`, { redirect: "follow" });
      const j = await r.json();
      if (typeof j.block === "number") block = j.block;
    } catch (e) { console.warn("block assignment failed, using hash fallback", e); }
  }
  if (block === null) {
    let h = 0; for (const ch of pid) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    block = h % nBlocks;
  }
  const screens = schedule.blocks[block];
  let i = saved && saved.block === block ? (saved.i || 0) : 0;
  const persist = () => { try { localStorage.setItem(saveKey, JSON.stringify({ block, i })); } catch (e) {} };

  function post(row) {
    row.pid = pid; row.block = block; row.ts = new Date().toISOString();
    if (!C.ENDPOINT) { console.log("response", row); return; }
    try {
      fetch(C.ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(row) });
    } catch (e) { console.warn(e); }
  }

  // ---------- intro, page 1 ----------
  function showIntro() {
    main.innerHTML = `
      <div class="sheet">
        <h2>Which outlines fit the trees better?</h2>
        <p>You will see an overhead photo of a city area. On the left and right are two copies with yellow outlines drawn around the trees by two different computer programs.</p>
        <p>Pick the side where the outlines match the individual trees better. Each outline should enclose a tree. Then rate the side you picked from 1 to 5 stars based on outline quality.</p>
        <p>${screens.length} screens, about ten seconds each.</p>
        <div class="center"><button class="go" id="next">Next</button></div>
      </div>`;
    document.getElementById("next").onclick = showExpectation;
  }

  // ---------- intro, page 2 ----------
  function showExpectation() {
    main.innerHTML = `
      <div class="sheet">
        <h2>Expectation of quality rating</h2>
        <p>Two examples of the same photo, to calibrate your stars.</p>
        <div class="expect">
          <div><img src="${exPath("five", 1)}" alt=""><div class="cap">We expect this to be a 5<span class="line">${starHtml(5, false)}</span></div></div>
          <div><img src="${exPath("one", 1)}" alt=""><div class="cap">We expect this to be a 1<span class="line">${starHtml(1, false)}</span></div></div>
        </div>
        <p class="small">Only your answers are recorded. No personal information is collected. You may stop at any time by closing this page.</p>
        <div class="center"><button class="go" id="go">Start</button></div>
      </div>`;
    document.getElementById("go").onclick = showScreen;
  }

  // ---------- reminder modal ----------
  let modalOpen = false, reminders = 0;
  function openReminder() {
    if (modalOpen) return;
    modalOpen = true; reminders += 1;
    const pairs = Array.from({ length: N_PAIRS }, (_, k) => `
      <div class="pair">
        <img src="${exPath("five", k + 1)}" alt=""><div class="cap">We expect this to be a 5<span class="stars">${starHtml(5, false).replace('class="stars"', 'class="stars inner"')}</span></div>
        <img src="${exPath("one", k + 1)}" alt=""><div class="cap">We expect this to be a 1<span class="stars">${starHtml(1, false).replace('class="stars"', 'class="stars inner"')}</span></div>
      </div>`).join("");
    const bd = document.createElement("div");
    bd.className = "backdrop";
    bd.innerHTML = `<div class="modal" role="dialog"><button class="close" aria-label="Close">&times;</button><h3>Quality expectations</h3><div class="grid">${pairs}</div><div class="foot"><button class="go" style="margin-top:8px">Back to rating</button></div></div>`;
    const close = () => { bd.remove(); modalOpen = false; };
    bd.querySelector(".close").onclick = close;
    bd.querySelector(".foot .go").onclick = close;
    bd.onclick = e => { if (e.target === bd) close(); };
    document.body.appendChild(bd);
  }

  // ---------- one screen ----------
  let armedAt = 0, phase = "idle", chosen = null, chosenAt = 0;
  function preload(k) {
    const s = screens[k]; if (!s) return;
    [imgPath(s.left, s.crop), rawPath(s.crop), imgPath(s.right, s.crop)].forEach(src => { const im = new Image(); im.src = src; });
  }
  function showScreen() {
    if (i >= screens.length) return finish();
    const s = screens[i];
    countEl.textContent = `${i + 1} / ${screens.length}`;
    progEl.style.width = `${(i / screens.length) * 100}%`;
    main.innerHTML = `
      <div class="prompt" id="prompt">Which side has more accurate outlines of the observed trees?</div>
      <div class="row">
        <div class="panel" id="pL"><span class="tag">Left</span><img src="${imgPath(s.left, s.crop)}" alt=""></div>
        <div class="panel"><span class="tag">Photo</span><img src="${rawPath(s.crop)}" alt=""></div>
        <div class="panel" id="pR"><span class="tag">Right</span><img src="${imgPath(s.right, s.crop)}" alt=""></div>
      </div>
      <div class="choices" id="choices">
        <button class="choice primary" data-c="left">Left is better<kbd>&larr;</kbd></button>
        <div class="mid-note">Choose left or right and rate</div>
        <button class="choice primary" data-c="right">Right is better<kbd>&rarr;</kbd></button>
      </div>
      <div class="hint" id="hint">Each outline should enclose a tree.</div>`;
    main.querySelectorAll("button.choice").forEach(b => b.onclick = () => choose(b.dataset.c));
    armedAt = performance.now(); phase = "choose"; chosen = null; reminders = 0;
    preload(i + 1);
  }
  function choose(c) {
    if (phase !== "choose") return;
    if (performance.now() - armedAt < 400) return;
    chosen = c; chosenAt = performance.now();
    phase = "rate";
    document.getElementById(c === "left" ? "pR" : "pL").classList.add("dim");
    const cp = document.getElementById(c === "left" ? "pL" : "pR");
    cp.classList.add("chosen");
    cp.insertAdjacentHTML("beforeend", '<div class="rate-label">Please rate on a 5 star scale</div>');
    document.getElementById("prompt").textContent = `How good is the ${c} side?`;
    document.getElementById("hint").textContent = "";
    const cells = ["", "", ""]; cells[c === "left" ? 0 : 2] = `<div><div class="rate">${starHtml(0, true)}<span class="val">&nbsp;</span></div><div class="rate-hint">5 star is high, 1 star is low. Half stars are allowed.<br><button class="remind" type="button">Remind me of the quality expectations</button></div></div>`;
    cells[1] = `<div class="rate"></div>`; cells[c === "left" ? 2 : 0] = `<div class="rate"></div>`;
    const ch = document.getElementById("choices"); ch.innerHTML = cells.join("");
    ch.querySelector(".remind").onclick = openReminder;
    const st = ch.querySelector(".stars"), on = st.querySelector(".on"), val = ch.querySelector(".val");
    const show = v => { on.style.width = `${(v / 5) * 100}%`; val.textContent = v ? v.toFixed(1) : ""; };
    st.querySelectorAll(".zones span").forEach(z => {
      z.onmouseenter = () => show(+z.dataset.h);
      z.onclick = () => { const v = +z.dataset.h; show(v); st.querySelectorAll(".zones span").forEach(x => x.onmouseenter = null); setTimeout(() => submit(v), 220); };
    });
    st.onmouseleave = () => { if (phase === "rate") show(0); };
  }
  function submit(rating) {
    if (phase === "done") return;
    phase = "done";
    const s = screens[i];
    post({ pos: i + 1, sid: s.id ?? "", crop: s.crop, left: s.left, right: s.right, type: s.type,
           choice: chosen, rating, reminders, ms: Math.round(chosenAt - armedAt), ms_rate: rating === "" ? 0 : Math.round(performance.now() - chosenAt) });
    i += 1; persist();
    showScreen();
  }
  document.addEventListener("keydown", e => {
    if (modalOpen) { if (e.key === "Escape") document.querySelector(".backdrop .close").click(); return; }
    if (phase === "choose") {
      if (e.key === "ArrowLeft") choose("left");
      else if (e.key === "ArrowRight") choose("right");
    } else if (phase === "rate" && /^[1-5]$/.test(e.key)) {
      const z = main.querySelector(`.zones span[data-h="${e.key}"]`); if (z) z.onclick();
    }
  });

  // ---------- end ----------
  function finish() {
    progEl.style.width = "100%"; countEl.textContent = "";
    post({ pos: 0, sid: "", crop: "", left: "", right: "", type: "done", choice: "", rating: "", reminders: 0, ms: 0, ms_rate: 0 });
    if (C.REDIRECT_URL) {
      main.innerHTML = `<div class="sheet center"><h2>Thank you</h2><p>Returning you to Prolific&hellip;</p></div>`;
      setTimeout(() => { location.href = C.REDIRECT_URL; }, 1200);
    } else {
      main.innerHTML = `<div class="sheet center"><h2>Thank you</h2><p>All ${screens.length} screens done. (No redirect configured.)</p></div>`;
    }
  }

  if (saved && saved.block === block && i > 0 && i < screens.length) showScreen(); else showIntro();
})();
</script>
</body>
</html>
